name: Mirror to Gitea

on:
  push:
    branches:
      - main
      - dev
    tags:
      - '*'
  schedule:
    - cron: '0 */10 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to Gitea
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -u
          if [ -z "${GITEA_TOKEN}" ]; then
            echo "::error::GITEA_TOKEN secret is empty. Set it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Token is passed via git's credential protocol, never written to .git/config
          git remote add gitea "https://gitea.com/aHuddini/UniPlaySong.git"
          git config --local credential.helper '!f() { echo "username=aHuddini"; echo "password=${GITEA_TOKEN}"; }; f'

          # Branches decide success. Tags are best-effort: a single tag that exists on Gitea at a
          # different commit makes "git push gitea --tags" exit non-zero, which used to fail the
          # whole mirror and report it as a token problem - the branches had already pushed fine.
          push_all() {
            git push gitea --branches || return 1
            if ! git push gitea --tags; then
              echo "::warning::Branches mirrored, but some tags were rejected. Usually one tag exists on Gitea at a different commit; compare with: git ls-remote --tags gitea"
            fi
            return 0
          }

          # First attempt
          if push_all; then
            echo "Mirror push succeeded on first attempt."
            exit 0
          fi

          echo "::warning::First mirror attempt failed. Retrying in 60s..."
          sleep 60

          # Retry (typed exit-status check so set -e doesn't ambush us)
          if push_all; then
            echo "Mirror push succeeded on retry."
            exit 0
          fi

          echo "::error::Mirror push failed twice - the BRANCH push did not succeed. Check the git output above for the real cause. If it was HTTP 403, the GITEA_TOKEN secret is expired/revoked or lacks repo:write scope; rotate it in repo Settings."
          exit 1
